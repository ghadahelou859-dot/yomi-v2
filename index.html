<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f8f3eb"><title>يومي V2 – غادة</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#eae5df;color:#574b43}button,input,select,textarea{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible{outline:2px solid #a47b68;outline-offset:2px}.app{--accent:#a87d69;--ink:#574b43;--card:rgba(255,255,255,.91);min-height:100dvh;max-width:700px;margin:auto;padding:22px 16px 120px;background:#f8f3eb;background-size:cover;background-position:center;background-attachment:fixed;position:relative}.app:before{content:"";position:absolute;inset:0;background:rgba(248,243,235,var(--veil,.22));pointer-events:none}.app>*{position:relative}.top,.row{display:flex;justify-content:space-between;align-items:center;gap:12px}.eyebrow,.muted{color:#8c7e73;font-size:13px}.top h1{font-size:26px;margin:5px 0}.top button,.iconbtn{border:0;border-radius:13px;padding:10px 12px;background:#fff9;color:#705e52}.card{background:var(--card);border:1px solid #eee5dc;border-radius:21px;padding:17px;margin:14px 0;box-shadow:0 5px 20px #49371c0b;backdrop-filter:blur(5px)}h2{font-size:18px;margin:0 0 12px}h3{font-size:15px;margin:10px 0}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.stat{background:#f5eee6;border-radius:14px;padding:11px 7px;text-align:center;font-size:12px}.stat b{display:block;font-size:21px;color:#a47b68}.special{background:linear-gradient(110deg,#ead8c7,#f9ebde)}.pill{display:inline-block;padding:5px 10px;border-radius:30px;background:#f1e9df;color:#8a715e;font-size:12px}.btn{border:0;border-radius:13px;padding:10px 14px;background:#a47b68;color:white}.btn.secondary{background:#f2e9df;color:#735b4d}.btn.small{padding:7px 11px;font-size:13px}.field{width:100%;border:1px solid #e6dcd2;border-radius:12px;padding:11px;background:#fff;color:#4d4139;margin:6px 0}.item{display:flex;align-items:center;gap:9px;padding:10px 0;border-bottom:1px solid #eee8e1}.item:last-child{border:0}.item input[type=checkbox]{accent-color:#7e9477;width:19px;height:19px}.item label{flex:1}.done{text-decoration:line-through;opacity:.55}.mini{font-size:12px}.section-title{margin:23px 3px 10px;font-size:20px}.counter{display:flex;align-items:center;gap:9px}.counter button{border:0;border-radius:9px;background:#f0e6da;padding:5px 10px;font-size:19px;color:#695346}.counter b{min-width:24px;text-align:center}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:700px;display:grid;grid-template-columns:repeat(5,1fr);background:#fffdf9f2;border-top:1px solid #e6ded4;padding:9px 4px max(12px,env(safe-area-inset-bottom));z-index:10}.nav button{border:0;background:transparent;color:#8c8076;font-size:12px;padding:5px 0}.nav button.active{color:#9f745f;font-weight:750}.nav .symbol{display:block;font-size:21px}.float{position:fixed;bottom:94px;left:max(18px,calc((100vw - 700px)/2 + 18px));z-index:8;border:0;border-radius:40px;background:#a47b68;color:#fff;padding:12px 18px;box-shadow:0 7px 22px #a47b6855}.panel{position:fixed;z-index:20;inset:0;background:#0006;display:flex;align-items:flex-end;justify-content:center}.panel.hidden,.hidden{display:none!important}.sheet{background:#fffaf5;border-radius:25px 25px 0 0;padding:22px;width:100%;max-width:700px;max-height:85dvh;overflow:auto}.sheet h2{margin-bottom:14px}.notice{font-size:12px;color:#846e61;line-height:1.6}.tabline{display:flex;gap:7px;overflow:auto;padding:5px 0}.tabline button{white-space:nowrap;border:0;border-radius:20px;padding:8px 12px;background:#f1e9e1;color:#765f50}.tabline button.active{background:#a47b68;color:#fff}.worship{background:#f4ede4;border-radius:14px;padding:12px;margin:8px 0}.worship .row{flex-wrap:wrap}.smallcard{background:#faf5ee;border-radius:15px;padding:12px}.error{color:#a53d3d}.good{color:#587c5b}@media(min-width:760px){.app{margin:22px auto;min-height:calc(100dvh - 44px);border-radius:26px;box-shadow:0 15px 55px #0001}}

@media(min-width:900px){body{background:#eee9e3}.app{max-width:none;width:calc(100% - 254px);margin:0 254px 0 0;min-height:100dvh;border-radius:0;box-shadow:none;padding:35px clamp(22px,4vw,72px) 80px;background-attachment:scroll}.app .top{max-width:1400px;margin:auto;align-items:flex-start}.app #content{max-width:1400px;margin:auto;display:block}.app #content>.card{max-width:none}.nav{inset:0 0 0 auto;transform:none;width:254px;max-width:none;display:flex;flex-direction:column;justify-content:flex-start;gap:9px;padding:40px 14px;background:#fffcf8;border:0;border-left:1px solid #e6ded4;box-shadow:-3px 0 20px #00000008}.nav:before{content:"يومي مع غادة ✿";font-size:22px;font-weight:750;color:#98715f;padding:0 12px 22px}.nav button{display:flex;align-items:center;gap:13px;padding:13px 16px;text-align:right;font-size:16px;border-radius:13px}.nav button.active{background:#f0e4da}.nav .symbol{font-size:22px}.float{left:28px;bottom:25px}.panel{align-items:center;padding:20px}.sheet{border-radius:24px;max-width:620px;max-height:84dvh}.tabline{flex-wrap:wrap;overflow:visible;gap:10px}.tabline button{padding:10px 19px}.wv-prayer,.wv-line{max-width:100%}.app #content>.grid{grid-template-columns:repeat(3,minmax(0,1fr))}.app #content>.card .stats{grid-template-columns:repeat(3,minmax(0,1fr))}}

</style></head><body><main class="app" id="app"><header class="top"><div><div class="eyebrow" id="today"></div><h1 id="heading">يومي مع غادة ✿</h1><div class="muted" id="subheading">مساحتي الخاصة للهدوء والإنجاز</div></div><button id="appearance" aria-label="تخصيص المظهر">🎨</button></header><section id="yomiCloud" class="card" style="margin:10px 0"><div class="row"><strong>☁️ حسابي والمزامنة</strong><span id="yomiCloudStatus" class="muted" aria-live="polite">جاري التحقق من الحساب</span></div><p id="yomiCloudEmail" class="muted"></p><form id="yomiCloudLogin" style="display:grid;gap:8px"><div id="yomiCloudAuth"><label>البريد الإلكتروني<input class="field" type="email" name="email" required autocomplete="email"></label><label>كلمة مرور حساب يومي الأصلي<input class="field" type="password" name="password" required autocomplete="current-password"></label><button class="btn" type="submit">دخول ومزامنة</button></div></form><div class="row"><button type="button" class="btn secondary small" id="yomiCloudSync">مزامنة الآن</button><button type="button" class="btn secondary small" id="yomiCloudLogout" hidden>خروج من الحساب</button></div><p class="muted">تُحفظ بيانات V2 في جدول مستقل عن يومي الأصلي. عند اختلاف نسختين، لن نستبدل البيانات تلقائيًا.</p></section><div id="content"></div></main><button class="float" id="moment">✨ لحظتي</button><nav class="nav" id="nav"></nav><div class="panel hidden" id="modal"><div class="sheet"><div class="row"><h2 id="modalTitle"></h2><button class="iconbtn" id="closeModal">✕</button></div><div id="modalBody"></div></div></div>
<script>
const sections=[['home','⌂','يومي'],['worship','☾','عباداتي'],['calendar','▦','تقويمي'],['work','▣','أعمالي'],['more','⋯','المزيد']];
const prayerNames=['الفجر','الظهر','العصر','المغرب','العشاء'],extraNames=['الضحى','قيام الليل'];
const dhikrNames=['الصلاة على النبي ﷺ','الاستغفار','لا إله إلا الله','سبحان الله وبحمده','الحمد لله'];
const defaults={tasks:[],prayers:{},nafl:{},dhikr:{},quran:0,quranTarget:5,quranSurah:'مريم',quranSurahPage:0,dua:[],events:[],projects:[],transactions:[],notes:[],water:0,goals:[],learning:[],moods:[],backgrounds:{},veil:22,cardOpacity:91};
const storageKey='yomi-v2-prototype-v1';let state;try{state=Object.assign({},defaults,JSON.parse(localStorage.getItem(storageKey)||'{}'))}catch(e){state={...defaults}};let page='home',worshipTab='prayers';const $=id=>document.getElementById(id),safe=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const save=()=>{try{localStorage.setItem(storageKey,JSON.stringify(state));window.dispatchEvent(new Event('yomi-v2-local-change'));$('saveState').textContent='محفوظ محليًا — المزامنة حسب حالة الحساب'}catch(e){$('saveState').textContent='تعذّر الحفظ: قد تكون الصورة كبيرة'}};const keyDay=()=>new Date().toLocaleDateString('en-CA');function perDay(field){const k=keyDay();if(!state[field]||state[field]._day!==k)state[field]={_day:k};return state[field]}function showModal(title,body){$('modalTitle').textContent=title;$('modalBody').innerHTML=body;$('modal').classList.remove('hidden')}function closeModal(){$('modal').classList.add('hidden')};$('closeModal').onclick=closeModal;$('modal').addEventListener('click',e=>{if(e.target===$('modal'))closeModal()});function fieldForm(type,placeholder){return '<form data-add="'+type+'"><input class="field" name="value" required maxlength="160" placeholder="'+placeholder+'"><button class="btn" type="submit">إضافة</button></form>'}function taskList(){return state.tasks.map((t,i)=>'<div class="item"><input type="checkbox" data-task="'+i+'" '+(t.done?'checked':'')+'><label class="'+(t.done?'done':'')+'">'+safe(t.text)+'</label><button class="btn secondary small" data-remove="tasks:'+i+'">حذف</button></div>').join('')||'<p class="muted">ما في مهام مضافة بعد.</p>'}function listRows(name){return (state[name]||[]).map((t,i)=>'<div class="item"><label>'+safe(typeof t==='string'?t:t.text)+'</label><button class="btn secondary small" data-remove="'+name+':'+i+'">حذف</button></div>').join('')||'<p class="muted">ما في عناصر مضافة بعد.</p>'}
function home(){let done=state.tasks.filter(x=>x.done).length;return '<section class="card"><h2>ملخص اليوم</h2><div class="stats"><div class="stat"><b>'+done+'/'+state.tasks.length+'</b>المهام</div><div class="stat"><b>'+prayerNames.filter(x=>perDay('prayers')[x]).length+'/5</b>الصلوات</div><div class="stat"><b>'+state.quran+'</b>صفحات القرآن</div></div></section><section class="card special"><span class="pill">✧ اليوم المميز</span><h2 style="margin-top:10px">لحظة تستحق الانتظار 🌷</h2><p class="muted">تقدري تضيفي مناسبة من التقويم، والربط بالعد التنازلي لاحقًا.</p></section><section class="card"><div class="row"><h2>مهامي</h2><span class="pill">بطاقة قابلة للتخصيص لاحقًا</span></div>'+taskList()+fieldForm('tasks','مهمة جديدة')+'</section><section class="card"><h2>اختصاراتي</h2><div class="grid"><button class="btn secondary" data-page="worship">☾ عباداتي</button><button class="btn secondary" data-page="calendar">▦ تقويمي</button><button class="btn secondary" data-page="work">▣ أعمالي</button><button class="btn secondary" data-page="more">⋯ المزيد</button></div></section>'}
function worship(){let p=perDay('prayers'),d=perDay('dhikr');let tabs=[['prayers','الصلوات'],['adhkar','الأذكار'],['quran','القرآن'],['dua','الأدعية']];let body='';if(worshipTab==='prayers'){body='<section class="card"><h2>صلوات اليوم</h2>'+prayerNames.map(n=>'<div class="item"><input type="checkbox" data-prayer="'+n+'" '+(p[n]?'checked':'')+'><label>'+n+'</label><span class="muted">تمت الصلاة</span></div>').join('')+'</section><section class="card"><h2>النوافل</h2><p class="muted">سجّلي عدد الركعات، وقيام الليل يُحسب ركعتين ركعتين.</p>'+extraNames.map(n=>'<div class="worship row"><strong>'+n+'</strong><div class="counter"><button data-nafl="'+n+'" data-delta="-2">−</button><b>'+(perDay('nafl')[n]||0)+'</b><button data-nafl="'+n+'" data-delta="2">+</button></div></div>').join('')+'</section>'}else if(worshipTab==='adhkar'){body='<section class="card"><h2>أذكاري اليومية</h2><p class="muted">اضغطي + لتسجيل الذكر. العداد يبدأ من جديد كل يوم.</p>'+dhikrNames.map(n=>'<div class="worship row"><strong>'+n+'</strong><div class="counter"><button data-dhikr="'+n+'" data-delta="-1">−</button><b>'+(d[n]||0)+'</b><button data-dhikr="'+n+'" data-delta="1">+</button></div></div>').join('')+'</section><section class="card"><h2>أذكار الصباح والمساء والنوم</h2><p class="muted">قوائم الأذكار الكاملة والنصوص المعتمدة رح نضيفها في مرحلة لاحقة.</p></section>'}else if(worshipTab==='quran'){body='<section class="card"><h2>وردي الثابت من القرآن</h2><p class="muted">عدد الصفحات المقروءة اليوم</p><div class="counter"><button data-quran="-1">−</button><b>'+state.quran+'</b><button data-quran="1">+</button><span class="pill">الهدف '+state.quranTarget+' صفحات</span></div><label class="muted">هدفي اليومي</label><input class="field" type="number" id="quranTarget" min="1" max="100" value="'+state.quranTarget+'"></section><section class="card"><h2>السورة المختارة</h2><label>اسم السورة</label><input class="field" id="surah" value="'+safe(state.quranSurah)+'"><div class="row"><span>صفحات قرأتها من السورة</span><div class="counter"><button data-surah="-1">−</button><b>'+state.quranSurahPage+'</b><button data-surah="1">+</button></div></div><p class="notice">هذا عدّاد تجريبي وليس مصحفًا أو تتبعًا دقيقًا لصفحات السورة بعد.</p></section>'}else{body='<section class="card"><h2>أدعيتي الخاصة</h2>'+listRows('dua')+fieldForm('dua','اكتبي دعاءً تريدين حفظه')+'</section>'}return '<h2 class="section-title">عباداتي ☾</h2><p class="muted">كل خطوة خير تستحق أن تُسجّل</p><div class="tabline">'+tabs.map(t=>'<button data-wtab="'+t[0]+'" class="'+(worshipTab===t[0]?'active':'')+'">'+t[1]+'</button>').join('')+'</div>'+body}
function calendar(){return '<h2 class="section-title">تقويمي ▦</h2><section class="card"><h2>مناسباتي ومواعيدي</h2>'+listRows('events')+fieldForm('events','موعد أو مناسبة جديدة')+'<p class="notice">إضافة التاريخ والتذكيرات وربط اليوم المميز ستكون في المرحلة التالية.</p></section>'}
function work(){return '<h2 class="section-title">أعمالي ▣</h2><section class="card"><h2>عملائي ومشاريعي</h2>'+listRows('projects')+fieldForm('projects','اسم العميل أو المشروع')+'<p class="notice">تفاصيل المشروع، الملفات، الوقت والمدفوعات لاحقًا.</p></section>'}
function more(){return '<h2 class="section-title">المزيد ⋯</h2><div class="grid">'+[['finance','ماليتي 💰'],['health','صحتي 🌿'],['life','حياتي 🌸'],['goals','أهدافي 🎯'],['learning','تعلّمي 📚'],['memories','ذكرياتي 📷'],['mood','مشاعري 💗']].map(x=>'<button class="card" style="margin:0;text-align:right" data-page="'+x[0]+'">'+x[1]+'</button>').join('')+'</div><section class="card"><button class="btn secondary" data-appearance="1">🎨 تخصيص خلفيات الصفحات</button></section>'}
function subpage(){let map={finance:['ماليتي','transactions','مصروف أو دخل (وصف تجريبي)'],health:['صحتي','water','أكواب الماء'],life:['حياتي','notes','ملاحظة شخصية'],goals:['أهدافي','goals','هدف جديد'],learning:['تعلّمي','learning','شيء أريد تعلّمه'],memories:['ذكرياتي','notes','ذكرى جديدة'],mood:['مشاعري','moods','كيف أشعر اليوم؟']};let [title,field,hint]=map[page]||map.life;if(field==='water')return '<h2 class="section-title">'+title+'</h2><section class="card"><h2>متابعة الماء</h2><div class="counter"><button data-water="-1">−</button><b>'+state.water+'</b><button data-water="1">+</button></div></section>';return '<h2 class="section-title">'+title+'</h2><section class="card"><h2>سجلاتي</h2>'+listRows(field)+fieldForm(field,hint)+'<p class="notice">هذه بداية تجريبية، وسنضيف التفاصيل والتقارير لاحقًا.</p></section>'}
function render(){let labels={home:'يومي مع غادة ✿',worship:'عباداتي ☾',calendar:'تقويمي',work:'أعمالي',more:'المزيد',finance:'ماليتي',health:'صحتي',life:'حياتي',goals:'أهدافي',learning:'تعلّمي',memories:'ذكرياتي',mood:'مشاعري'};$('heading').textContent=labels[page];$('subheading').textContent='نسخة V2 — مزامنة الحساب متاحة من لوحة السحابة';$('today').textContent=new Intl.DateTimeFormat('ar-PS',{weekday:'long',day:'numeric',month:'long',year:'numeric'}).format(new Date());$('content').innerHTML=(page==='home'?home():page==='worship'?worship():page==='calendar'?calendar():page==='work'?work():page==='more'?more():subpage())+'<p id="saveState" class="notice">البيانات محفوظة على هذا الجهاز فقط. لا تحذفي بيانات المتصفح إذا أردتِ الاحتفاظ بها.</p>';$('nav').innerHTML=sections.map(x=>'<button data-page="'+x[0]+'" class="'+(page===x[0]?'active':'')+'"><span class="symbol">'+x[1]+'</span>'+x[2]+'</button>').join('');bgApply();$('app').style.setProperty('--veil',String((Number(state.veil)||0)/100));$('app').style.setProperty('--card','rgba(255,255,255,'+Number(state.cardOpacity)/100+')')}
const BG_DB='yomi-v2-backgrounds',BG_STORE='images';let bgPreviewURL='',bgObjectURL='',bgRenderToken=0;
function bgDB(){return new Promise((resolve,reject)=>{const request=indexedDB.open(BG_DB,1);request.onupgradeneeded=()=>{if(!request.result.objectStoreNames.contains(BG_STORE))request.result.createObjectStore(BG_STORE)};request.onsuccess=()=>resolve(request.result);request.onerror=()=>reject(request.error)})}
async function bgPut(key,blob){const db=await bgDB();try{await new Promise((resolve,reject)=>{const tx=db.transaction(BG_STORE,'readwrite');tx.objectStore(BG_STORE).put(blob,key);tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)})}finally{db.close()}}
async function bgGet(key){const db=await bgDB();try{return await new Promise((resolve,reject)=>{const tx=db.transaction(BG_STORE,'readonly');const req=tx.objectStore(BG_STORE).get(key);req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)})}finally{db.close()}}
async function bgDelete(key){const db=await bgDB();try{await new Promise((resolve,reject)=>{const tx=db.transaction(BG_STORE,'readwrite');tx.objectStore(BG_STORE).delete(key);tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)})}finally{db.close()}}
async function compressBackground(file){const bitmap=await createImageBitmap(file);try{const max=2200,scale=Math.min(1,max/Math.max(bitmap.width,bitmap.height));const canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(bitmap.width*scale));canvas.height=Math.max(1,Math.round(bitmap.height*scale));canvas.getContext('2d').drawImage(bitmap,0,0,canvas.width,canvas.height);return await new Promise((resolve,reject)=>canvas.toBlob(blob=>blob?resolve(blob):reject(new Error('compression failed')),'image/jpeg',.83))}finally{bitmap.close()}}
async function bgApply(){const token=++bgRenderToken;try{const blob=await bgGet(page)||await bgGet('all');if(token!==bgRenderToken)return;if(bgObjectURL){URL.revokeObjectURL(bgObjectURL);bgObjectURL=''}if(blob){bgObjectURL=URL.createObjectURL(blob);$('app').style.backgroundImage='url("'+bgObjectURL+'")'}else{const legacy=state.backgrounds[page]||state.backgrounds.all||'';$('app').style.backgroundImage=legacy?'url("'+legacy+'")':'none'}}catch(e){/* keep existing legacy wallpaper */}}
let bgPending=null;
async function bgChoose(file){if(!file)return;const info=$('bgStatus');if(file.size>20*1024*1024){if(info)info.textContent='الحد الأقصى للصورة 20 ميغابايت';return}if(!/^image\/(jpeg|png|webp)$/.test(file.type)){if(info)info.textContent='اختاري JPG أو PNG أو WebP';return}try{if(info)info.textContent='جاري تجهيز الصورة...';const blob=await compressBackground(file);bgPending=blob;if(bgPreviewURL)URL.revokeObjectURL(bgPreviewURL);bgPreviewURL=URL.createObjectURL(blob);const preview=$('bgPreview');if(preview){preview.src=bgPreviewURL;preview.hidden=false}if(info)info.textContent='جاهزة للمعاينة — الحجم بعد الضغط '+(blob.size/1024/1024).toFixed(2)+' ميغابايت. اضغطي اعتماد الخلفية.'}catch(e){if(info)info.textContent='تعذر معالجة الصورة. جرّبي صورة أخرى.'}}
function appearance(){bgPending=null;showModal('🎨 خلفيات يومي','<p class="muted">ارفعي صورة من جهازك، وحددي إن كانت لكل الصفحات أو لهذه الصفحة فقط.</p><label>تطبيق الخلفية على</label><select class="field" id="bgScope"><option value="page">هذه الصفحة فقط</option><option value="all">كل الصفحات (الافتراضي)</option></select><input class="field" id="bgFile" type="file" accept="image/jpeg,image/png,image/webp"><p class="notice">يمكنك اختيار صورة حتى 20 ميغابايت. تُضغط تلقائيًا وتُحفظ على هذا الجهاز فقط، دون رفعها إلى خادم.</p><img id="bgPreview" alt="معاينة الخلفية" hidden style="width:100%;max-height:260px;object-fit:contain;border-radius:14px;margin:10px 0"><p class="notice" id="bgStatus">اختاري صورة لعرض المعاينة.</p><button type="button" class="btn" id="bgAccept">اعتماد الخلفية</button><button class="btn secondary small" id="clearBg">إزالة خلفية النطاق المختار</button><hr style="border:0;border-top:1px solid #e6ddd2;margin:18px 0"><label>تهدئة الخلفية <b id="veilNum">'+state.veil+'%</b></label><input class="field" type="range" id="veil" min="0" max="95" value="'+state.veil+'"><label>عتامة البطاقات <b id="cardNum">'+state.cardOpacity+'%</b></label><input class="field" type="range" id="cardOpacity" min="35" max="100" value="'+state.cardOpacity+'"><p class="notice">تخصيص الملصقات والخلفيات المتحركة يأتي في مرحلة لاحقة، والحركة ستكون مغلقة افتراضيًا.</p>')}
document.addEventListener('click',e=>{let b=e.target.closest('[data-page],[data-wtab],[data-delta],[data-quran],[data-surah],[data-water],[data-remove],[data-appearance]');if(!b)return;if(b.dataset.page){page=b.dataset.page;render();window.scrollTo(0,0)}else if(b.dataset.wtab){worshipTab=b.dataset.wtab;render()}else if(b.dataset.dhikr){let d=perDay('dhikr'),n=b.dataset.dhikr;d[n]=Math.max(0,(d[n]||0)+Number(b.dataset.delta));render();save()}else if(b.dataset.nafl){let d=perDay('nafl'),n=b.dataset.nafl;d[n]=Math.max(0,(d[n]||0)+Number(b.dataset.delta));render();save()}else if(b.dataset.quran){state.quran=Math.max(0,state.quran+Number(b.dataset.quran));render();save()}else if(b.dataset.surah){state.quranSurahPage=Math.max(0,state.quranSurahPage+Number(b.dataset.surah));render();save()}else if(b.dataset.water){state.water=Math.max(0,state.water+Number(b.dataset.water));render();save()}else if(b.dataset.remove){let [name,i]=b.dataset.remove.split(':');state[name].splice(Number(i),1);render();save()}else if(b.dataset.appearance){appearance()}});
document.addEventListener('change',e=>{let t=e.target;if(t.dataset.prayer){perDay('prayers')[t.dataset.prayer]=t.checked;render();save()}else if(t.dataset.task!==undefined){state.tasks[Number(t.dataset.task)].done=t.checked;render();save()}else if(t.id==='quranTarget'){state.quranTarget=Math.max(1,Number(t.value)||5);render();save()}else if(t.id==='surah'){state.quranSurah=t.value;save()}else if(t.id==='bgFile'&&t.files?.[0]){bgChoose(t.files[0])}});
document.addEventListener('input',e=>{if(e.target.id==='veil'){state.veil=Number(e.target.value);$('veilNum').textContent=state.veil+'%';$('app').style.setProperty('--veil',state.veil/100);save()}if(e.target.id==='cardOpacity'){state.cardOpacity=Number(e.target.value);$('cardNum').textContent=state.cardOpacity+'%';$('app').style.setProperty('--card','rgba(255,255,255,'+state.cardOpacity/100+')');save()}});
document.addEventListener('submit',e=>{let f=e.target.closest('[data-add]');if(!f)return;e.preventDefault();let type=f.dataset.add,v=f.elements.value.value.trim();if(!v)return;if(type==='tasks')state.tasks.push({text:v,done:false});else state[type].push(v);render();save()});
document.addEventListener('click',e=>{if(e.target.id==='bgAccept'){if(!bgPending){const info=$('bgStatus');if(info)info.textContent='اختاري صورة أولًا';return}const key=$('bgScope').value==='all'?'all':page;const blob=bgPending;bgPut(key,blob).then(()=>{delete state.backgrounds[key];save();bgApply();closeModal();bgPending=null}).catch(()=>{const info=$('bgStatus');if(info)info.textContent='تعذر حفظ الصورة على هذا الجهاز، لم يتم تغيير الخلفية.'});return}if(e.target.id==='clearBg'){let scope=$('bgScope').value,key=scope==='all'?'all':page;bgDelete(key).then(()=>{delete state.backgrounds[key];save();bgApply();closeModal()}).catch(()=>{const info=$('bgStatus');if(info)info.textContent='تعذر إزالة الخلفية'});return}});
$('appearance').onclick=appearance;$('moment').onclick=()=>showModal('✨ لحظتي','<p>اختاري المساحة اللي بتحتاجيها اليوم:</p><div class="grid">'+['بدي أنجز','بدي أروق','بدي أفضفض','بدي أتعلم','بدي أرتب أفكاري'].map(x=>'<button class="btn secondary" onclick="document.getElementById(\'modalBody\').innerHTML=\'<p>هذه المساحة قيد التطوير: '+x+'</p>\'">'+x+'</button>').join('')+'</div>');render();
</script><script src="./worship-v2.js?v=20261019f"></script><script type="module" src="./cloud-v2.js?v=20261020a"></script></body></html>
